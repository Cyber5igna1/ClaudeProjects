<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Trading Bot{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <span class="nav-brand">⚡ Trading Bot</span>
    <div class="nav-links">
      <a href="/comparison" {% if request.url.path == "/" or "comparison" in request.url.path %}class="active"{% endif %}>Comparison</a>
      <a href="/ml"         {% if "ml"   in request.url.path %}class="active"{% endif %}>ML Insights</a>
      <a href="/live"       {% if "live" in request.url.path %}class="active"{% endif %}>Live Monitor</a>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">Trading Bot Dashboard — Data from SQLite</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
